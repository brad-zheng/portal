<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>郑大钱 · 个人门户</title>
<style>
  :root {
    --bg: #090b0e;
    --surface: #111318;
    --border: #1c1f26;
    --border-light: #252830;
    --text: #c8cdd4;
    --text-dim: #6b7080;
    --text-muted: #494f5c;
    --accent: #5e7d9e;
    --accent-dim: rgba(94,125,158,0.10);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: 0 16px 40px;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .container { max-width: 420px; margin: 0 auto; }

  /* ── Header ── */
  .header {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 48px 0 8px;
  }
  .header span {
    font-size: 22px; font-weight: 700; letter-spacing: 0.5px;
  }
  .header .arrow { color: var(--text-muted); font-weight: 300; }
  .header .goal { color: var(--accent); }
  .header-icon { flex-shrink: 0; }
  .header-date { text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  /* ── Divider ── */
  .divider {
    height: 1px; background: var(--border); margin: 20px 0;
    opacity: 0.5;
  }

  /* ── Section Title ── */
  .section-title {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1.2px;
    margin: 22px 0 10px;
  }

  /* ── Today Card ── */
  .today-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
  }
  .today-top {
    display: flex; align-items: center; gap: 14px; margin-bottom: 10px;
  }
  .today-label {
    font-size: 18px; font-weight: 700; color: var(--accent);
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--accent-dim); border: 1px solid rgba(94,125,158,0.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .today-info { flex: 1; }
  .today-day { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .today-title { font-size: 18px; font-weight: 700; }
  .today-duration {
    display: inline-block; font-size: 11px; color: var(--text-dim);
    background: rgba(255,255,255,0.03); padding: 2px 8px; border-radius: 4px;
    margin-top: 4px; letter-spacing: 0.5px;
  }
  .today-desc {
    font-size: 12px; color: var(--text-dim); line-height: 1.7;
    padding-top: 12px; border-top: 1px solid var(--border);
  }
  .today-actions {
    display: flex; gap: 8px; margin-top: 14px;
  }
  .today-actions .btn {
    flex:1; padding: 10px 0; border-radius: 8px; text-align: center;
    font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.3px;
  }
  .today-actions .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--accent-dim); color: var(--accent); }
  .btn-outline { background: transparent; color: var(--text-dim); border: 1px solid var(--border-light); }
  .btn-outline:active { border-color: var(--accent); color: var(--text); }

  /* ── Week Row ── */
  .week-row {
    display: flex; gap: 4px; margin-top: 12px;
  }
  .week-day {
    flex: 1; min-width: 0; text-align: center; padding: 8px 1px 6px;
    border-radius: 8px; background: var(--surface); border: 1px solid var(--border);
    font-size: 10px; color: var(--text-dim);
  }
  .week-day.today {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }
  .week-day .wd-label {
    width: 28px; height: 28px; border-radius: 7px; margin: 0 auto 6px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--text-dim);
  }
  .week-day.today .wd-label {
    background: var(--accent-dim); border-color: var(--accent);
    color: var(--accent);
  }
  .week-day .wd-name { font-weight: 600; font-size: 11px; }
  .week-day .wd-title { font-size: 9px; display: block; margin-top: 2px; opacity: 0.55; letter-spacing: -0.2px; }

  /* ── Link Grid ── */
  .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .link-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 14px; text-decoration: none;
    display: flex; align-items: center; gap: 12px;
    transition: border-color 0.15s, background 0.15s;
  }
  .link-card:active { border-color: var(--accent); background: var(--accent-dim); }
  .link-card .lc-svg {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border-light);
  }
  .link-card .lc-text { flex: 1; min-width: 0; }
  .link-card .lc-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .link-card .lc-sub { font-size: 10px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Footer ── */
  .footer {
    text-align: center; color: var(--text-muted); font-size: 10px;
    margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="container">

<!-- Header -->
<div class="header">
  <span>郑大钱</span>
  <span class="arrow">← →</span>
  <span class="goal">郑在变大</span>
</div>
<div class="header-date" id="headerDate"></div>

<div class="divider"></div>

<!-- 今日训练计划 -->
<div class="section-title">今日训练计划</div>
<div class="today-card" id="todayCard">
  <div class="today-top">
    <div class="today-label" id="todayLabel"></div>
    <div class="today-info">
      <div class="today-day" id="todayDay"></div>
      <div class="today-title" id="todayTitle"></div>
      <span class="today-duration" id="todayDuration"></span>
    </div>
  </div>
  <div class="today-desc" id="todayDesc"></div>
  <div class="today-actions" id="todayActions"></div>
</div>

<!-- 周概览 -->
<div class="week-row" id="weekRow"></div>

<!-- 快捷入口 -->
<div class="section-title">快捷入口</div>
<div class="link-grid">
  <a class="link-card" href="#" id="linkTrainingCard">
    <svg class="lc-svg" width="40" height="40" viewBox="0 0 40 40"><rect x="8" y="6" width="24" height="28" rx="3" fill="none" stroke="#6b7080" stroke-width="1.5"/><line x1="13" y1="13" x2="27" y2="13" stroke="#6b7080" stroke-width="1.5"/><line x1="13" y1="19" x2="27" y2="19" stroke="#6b7080" stroke-width="1.5"/><line x1="13" y1="25" x2="22" y2="25" stroke="#6b7080" stroke-width="1.5"/></svg>
    <div class="lc-text"><div class="lc-title">训练卡</div><div class="lc-sub">月1筑基期 · 交互版</div></div>
  </a>
  <a class="link-card" href="https://docs.qq.com/smartsheet/DRWFRRW1GaGVrVUxx?_fid=EaQEmFhekULq" target="_blank" rel="noopener">
    <svg class="lc-svg" width="40" height="40" viewBox="0 0 40 40"><rect x="10" y="10" width="20" height="20" rx="3" fill="none" stroke="#6b7080" stroke-width="1.5"/><polyline points="14,21 18,25 26,16" fill="none" stroke="#6b7080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="lc-text"><div class="lc-title">打卡表A</div><div class="lc-sub">每日训练打卡</div></div>
  </a>
  <a class="link-card" href="https://docs.qq.com/smartsheet/DRWJ5eWpvQ3JqY3JR?_fid=EbyyjoCrjcrQ" target="_blank" rel="noopener">
    <svg class="lc-svg" width="40" height="40" viewBox="0 0 40 40"><rect x="7" y="19" width="6" height="14" rx="1" fill="none" stroke="#6b7080" stroke-width="1.5"/><rect x="17" y="12" width="6" height="21" rx="1" fill="none" stroke="#6b7080" stroke-width="1.5"/><rect x="27" y="7" width="6" height="26" rx="1" fill="none" stroke="#6b7080" stroke-width="1.5"/></svg>
    <div class="lc-text"><div class="lc-title">打卡表B</div><div class="lc-sub">基线测试与评估</div></div>
  </a>
  <a class="link-card" href="https://brad-zheng.github.io/weather-dashboard/" target="_blank" rel="noopener">
    <svg class="lc-svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="7" fill="none" stroke="#6b7080" stroke-width="1.5"/><line x1="20" y1="7" x2="20" y2="12" stroke="#6b7080" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="28" x2="20" y2="33" stroke="#6b7080" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="20" x2="12" y2="20" stroke="#6b7080" stroke-width="1.5" stroke-linecap="round"/><line x1="28" y1="20" x2="33" y2="20" stroke="#6b7080" stroke-width="1.5" stroke-linecap="round"/></svg>
    <div class="lc-text"><div class="lc-title">天气看板</div><div class="lc-sub">337城 · 三年对比</div></div>
  </a>
</div>

<div class="footer">郑大钱 · 个人门户 &copy; 2026</div>

</div>

<script>
// ── Short labels for each day ──
const dayLabels = {
  0: '核',  // 周日: 核心
  1: '休',  // 周一: 休息
  2: '推',  // 周二: 上肢推
  3: '腿',  // 周三: 下肢
  4: '拉',  // 周四: 上肢拉
  5: '羽',  // 周五: 羽毛球
  6: '骑',  // 周六: 骑行
};

const schedule = {
  0: { name:'周日', type:'core',     label:'核',   title:'核心+拉伸',      dur:'~30min',  desc:'平板支撑 · 侧平板 · 死虫式 · 猫牛式 · 臀桥 · 全身拉伸' },
  1: { name:'周一', type:'rest',      label:'休',   title:'完全休息',        dur:'',         desc:'工作最忙的一天，吃好睡好，不安排任何训练' },
  2: { name:'周二', type:'push',      label:'推',   title:'上肢推+核心',     dur:'~50min',   desc:'上斜俯卧撑 · 跪姿钻石俯卧撑 · 凳上臂屈伸 · 侧平举 · 平板支撑' },
  3: { name:'周三', type:'legs',      label:'腿',   title:'下肢+核心',       dur:'~50min',   desc:'徒手深蹲 · 后撤弓步蹲 · 臀桥 · 提踵 · 死虫式 · 鸟狗式 · 留力给周五' },
  4: { name:'周四', type:'pull',      label:'拉',   title:'上肢拉+背+核心',  dur:'~55min',   desc:'俯卧YTWL · 门框划船 · 桌边俯身划船 · 毛巾滑墙下拉 · 超人式 · 面拉' },
  5: { name:'周五', type:'badminton', label:'羽',   title:'羽毛球',          dur:'~2h',      desc:'高强度间歇+下肢爆发力，天然HIIT训练。打球前吃碳水，充分热身。' },
  6: { name:'周六', type:'cycling',   label:'骑',   title:'户外骑行',        dur:'2-4h',     desc:'Zone 2有氧耐力骑，40-60km，踏频85-95rpm。戴头盔！补水！' },
};

const today = new Date();
const dayOfWeek = today.getDay();

// Header date
document.getElementById('headerDate').textContent =
  today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日  ' + schedule[dayOfWeek].name;

// Today card
const plan = schedule[dayOfWeek];
document.getElementById('todayLabel').textContent = plan.label;
document.getElementById('todayDay').textContent = plan.name;
document.getElementById('todayTitle').textContent = plan.title;
document.getElementById('todayDuration').textContent = plan.dur;
document.getElementById('todayDesc').textContent = plan.desc;

// 3 buttons
const actions = document.getElementById('todayActions');
const trainCardHref = 'training.html';
if (plan.type === 'rest') {
  actions.innerHTML = '<span style="font-size:12px;color:var(--text-dim);padding:8px 0">享受休息，肌肉在休息时才生长</span>';
} else {
  actions.innerHTML =
    '<a class="btn btn-primary" href="' + trainCardHref + '">训练卡</a>' +
    '<a class="btn btn-secondary" href="https://docs.qq.com/smartsheet/DRWFRRW1GaGVrVUxx?_fid=EaQEmFhekULq" target="_blank" rel="noopener">去打卡</a>' +
    '<a class="btn btn-outline" href="https://docs.qq.com/smartsheet/DRWJ5eWpvQ3JqY3JR?_fid=EbyyjoCrjcrQ" target="_blank" rel="noopener">去评估</a>';
}

// Training card link
document.getElementById('linkTrainingCard').href = trainCardHref;

// Week row: Mon(1) → Sun(0)
const weekRow = document.getElementById('weekRow');
const weekOrder = [1, 2, 3, 4, 5, 6, 0]; // Mon → Sun
for (const d of weekOrder) {
  const s = schedule[d];
  const div = document.createElement('div');
  div.className = 'week-day' + (d === dayOfWeek ? ' today' : '');
  div.innerHTML =
    '<div class="wd-label">' + s.label + '</div>' +
    '<span class="wd-name">' + s.name + '</span>' +
    '<span class="wd-title">' + s.title + '</span>';
  weekRow.appendChild(div);
}
</script>
</body>
</html>
